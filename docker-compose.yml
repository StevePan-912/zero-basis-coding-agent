# Docker Compose configuration for zero-basis-coding-agent
# Production-ready multi-container setup

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: coding-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-coding_agent}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-coding_agent_password}
      POSTGRES_DB: ${DB_NAME:-coding_agent_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-coding_agent} -d ${DB_NAME:-coding_agent_db}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - backend-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: coding-agent-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - backend-network

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coding-agent-backend
    restart: unless-stopped
    environment:
      # Database Configuration
      DATABASE_URL: postgresql://${DB_USER:-coding_agent}:${DB_PASSWORD:-coding_agent_password}@postgres:5432/${DB_NAME:-coding_agent_db}
      REDIS_URL: redis://redis:6379/0
      # LLM API Keys
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # JWT Configuration
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
      JWT_ACCESS_TOKEN_EXPIRES: ${JWT_ACCESS_TOKEN_EXPIRES:-3600}
      # Cost Control
      FREE_TIER_API_LIMIT: ${FREE_TIER_API_LIMIT:-50}
      PAID_TIER_API_LIMIT: ${PAID_TIER_API_LIMIT:-500}
      # Flask Configuration
      DEBUG: ${DEBUG:-False}
      HOST: 0.0.0.0
      PORT: 5000
      # Flask Secret Key
      SECRET_KEY: ${SECRET_KEY:-your-flask-secret-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - backend-network
      - frontend-network

  # Frontend Web Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: coding-agent-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - frontend-network

networks:
  backend-network:
    driver: bridge
  frontend-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local